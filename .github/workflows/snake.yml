name: Generate snake animation

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml
      - snake-snapshot.svg

concurrency:
  group: snake-animation
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake-live.svg?palette=github-dark

      - name: Keep the complete authorized activity calendar
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const output = 'dist/snake-live.svg';
          const moves = (svg) => {
            const keyframes = svg.split('@keyframes s0')[1]?.split('@keyframes s1')[0];
            const positions = keyframes ? [...keyframes.matchAll(/transform:translate\(([^)]+)\)/g)].map(match => match[1]) : [];
            return new Set(positions).size > 1;
          };
          const filled = (svg) => (svg.match(/@keyframes c[a-z0-9]+\{/gi) || []).length;
          const generated = await readFile(output, 'utf8');
          const url = `https://raw.githubusercontent.com/${process.env.GITHUB_REPOSITORY}/${process.env.GITHUB_SHA}/snake-snapshot.svg`;
          const response = await fetch(url);
          if (!response.ok) throw new Error('Authorized activity snapshot is unavailable');
          const snapshot = await response.text();
          if (!moves(snapshot)) throw new Error('Activity snapshot is not animated');
          if (!moves(generated) || filled(snapshot) > filled(generated)) {
            await writeFile(output, snapshot);
            console.log(`Using the complete authorized snapshot: ${filled(snapshot)} occupied days; visible calendar has ${filled(generated)}.`);
          } else {
            console.log(`Using the current GitHub calendar with ${filled(generated)} occupied days.`);
          }
          NODE

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: snake-output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reference the published animation without stale image caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const api = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json'
          };
          const get = async (path) => {
            const response = await fetch(api + path, {headers});
            if (!response.ok) throw new Error(`GitHub read failed: ${response.status}`);
            return response.json();
          };
          const head = await get('/git/ref/heads/snake-output');
          if (!/^[a-f0-9]{40}$/.test(head.object.sha)) throw new Error('Invalid animation revision');
          const file = await get(`/contents/README.md?ref=${process.env.GITHUB_REF_NAME}`);
          const previous = Buffer.from(file.content, 'base64').toString('utf8');
          const image = `<img src="https://raw.githubusercontent.com/${process.env.GITHUB_REPOSITORY}/${head.object.sha}/snake-live.svg" alt="Snake animation" />`;
          const current = previous.replace(/<img src="[^"]+" alt="Snake animation" \/>/, image);
          if (current === previous) {
            console.log('README already references this animation revision.');
          } else {
            const response = await fetch(api + '/contents/README.md', {
              method: 'PUT', headers,
              body: JSON.stringify({
                message: 'Update snake animation reference',
                content: Buffer.from(current).toString('base64'),
                sha: file.sha,
                branch: process.env.GITHUB_REF_NAME
              })
            });
            if (!response.ok) throw new Error(`README update failed: ${response.status}`);
            console.log('README now references the published animation revision.');
          }
          NODE
